<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tutorial Métricas V2.0</title>
    <style>
        .kpis-grid-v2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; }
        .tab-button-v2 { padding: 10px 20px; margin: 5px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; }
        .tab-button-v2.active { background: #007bff; color: white; }
        .header-actions-v2 { display: flex; gap: 10px; padding: 10px; }
        .version-badge { background: #28a745; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .kpi-card-v2 { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
        #estadisticas-section { padding: 20px; background: #f8f9fa; }
        #tab-content-resumen { padding: 20px; }
    </style>
</head>
<body>
    <div id="estadisticas-section" class="dashboard-content-section">
        <div class="section-header-v2">
            <div class="header-content-v2">
                <h3><i class="fas fa-chart-bar"></i> Métricas Administrativas</h3>
                <div class="header-meta">
                    <span class="version-badge">v2.0</span>
                </div>
            </div>
            <div class="header-actions-v2">
                <button id="refresh-metricas-v2">Actualizar</button>
                <button id="export-metricas-v2">Exportar</button>
            </div>
        </div>

        <div class="metricas-tabs-navigation">
            <div class="tabs-container-v2">
                <button class="tab-button-v2 active" data-tab="resumen" id="tab-resumen">Resumen General</button>
                <button class="tab-button-v2" data-tab="equipos" id="tab-equipos">Vista por Equipos</button>
                <button class="tab-button-v2" data-tab="individual" id="tab-individual">Análisis Individual</button>
                <button class="tab-button-v2" data-tab="tendencias" id="tab-tendencias">Tendencias & Reportes</button>
            </div>
        </div>

        <div class="tabs-content-container">
            <div id="tab-content-resumen" class="tab-content-v2 active" data-tab="resumen">
                <div class="kpis-global-section">
                    <div class="kpis-grid-v2">
                        <div class="kpi-card-v2 total-reclutas">
                            <div class="kpi-content-v2">
                                <div class="kpi-number">150</div>
                                <div class="kpi-label">Total Reclutas</div>
                            </div>
                        </div>
                        <div class="kpi-card-v2 conversion-rate">
                            <div class="kpi-content-v2">
                                <div class="kpi-number">75%</div>
                                <div class="kpi-label">Tasa de Conversión</div>
                            </div>
                        </div>
                        <div class="kpi-card-v2 active-teams">
                            <div class="kpi-content-v2">
                                <div class="kpi-number">8</div>
                                <div class="kpi-label">Equipos Activos</div>
                            </div>
                        </div>
                        <div class="kpi-card-v2 performance-global">
                            <div class="kpi-content-v2">
                                <div class="kpi-number">82%</div>
                                <div class="kpi-label">Performance Global</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/tutorial.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🧪 Iniciando test del tutorial V2.0...');

            // Verificar detección de página
            console.log('🔍 ¿Es página de métricas?', Tutorial.isMetricsPage());

            // Probar función específica
            if (typeof Tutorial.startMetricasV2Tutorial === 'function') {
                console.log('✅ Función Tutorial.startMetricasV2Tutorial disponible');

                // Agregar botón de prueba
                const testButton = document.createElement('button');
                testButton.innerHTML = '🎓 Iniciar Tutorial V2.0';
                testButton.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;';
                testButton.onclick = function() {
                    console.log('🚀 Iniciando tutorial de métricas V2.0...');
                    Tutorial.startMetricasV2Tutorial();
                };
                document.body.appendChild(testButton);
            } else {
                console.error('❌ Función Tutorial.startMetricasV2Tutorial no encontrada');
            }
        });
    </script>
</body>
</html>
