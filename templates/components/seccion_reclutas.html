<!-- Sección de reclutas -->
<div id="reclutas-section" class="dashboard-content-section active">
    <div class="section-header">
        <h3><i class="fas fa-users"></i> Gestión de Reclutas</h3>
        <div class="section-actions">
            <div class="search-container">
                <input type="text" id="search-reclutas" placeholder="Buscar reclutas...">
                <i class="fas fa-search"></i>
            </div>

            <button class="btn-primary" id="open-add-recluta-modal">
                <i class="fas fa-user-plus"></i> Agregar Nuevo Recluta
            </button>
        </div>
    </div>

    <!-- 🔄 LOADER PARA GESTIÓN DE RECLUTAS -->
    <div id="reclutas-loader" class="loader-overlay-v2" style="display: none;">
        <div class="loader-content-v2">
            <div class="spinner-v2"></div>
            <p class="loader-text">Cargando gestión de reclutas...</p>
            <div class="loader-progress">
                <div class="progress-bar-v2">
                    <div id="reclutas-progress-fill" class="progress-fill-v2"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="reclutas-container">
        <div class="card">
            <div class="card-content">
                <div class="filter-controls">
                    <div class="filter-group">
                        <label for="filter-estado">Estado:</label>
                        <select id="filter-estado">
                            <option value="todos">Todos</option>
                            <option value="Activo">Activo</option>
                            <option value="En proceso">En proceso</option>
                            <option value="Rechazado">Rechazado</option>
                        </select>
                    </div>

                    <!-- Filtro por Asesor para Gerentes -->
                    {% if current_user.rol in ['admin', 'gerente'] %}
                    <div class="filter-group gerente-only-filter" id="filter-gerente-asesores-group">
                        <label for="filter-gerente-asesores">Asesores:</label>
                        <select id="filter-gerente-asesores">
                            <option value="todos">Todos mis asesores</option>
                            <option value="sin_asignar">Sin asignar</option>
                            <!-- Las opciones se llenarán dinámicamente con asesores del gerente -->
                        </select>
                    </div>
                    {% endif %}

                    <div class="filter-group">
                        <label for="sort-by">Ordenar por:</label>
                        <select id="sort-by">
                            <option value="nombre-asc">Nombre (A-Z)</option>
                            <option value="nombre-desc">Nombre (Z-A)</option>
                            <option value="fecha_registro-asc">Fecha (Antiguo-Nuevo)</option>
                            <option value="fecha_registro-desc">Fecha (Nuevo-Antiguo)</option>
                        </select>
                    </div>

                    {% if current_user.rol == 'admin' %}
                    <div class="filter-group filter-group--button admin-only" id="filter-gerente-control">
                        <label for="filter-by-gerente-btn">Gerentes:</label>
                        <button type="button" class="btn-secondary filter-button" id="filter-by-gerente-btn" aria-haspopup="listbox" aria-expanded="false">
                            <i class="fas fa-user-tie"></i> Filtrar por Gerente
                        </button>
                        <div class="filter-dropdown" id="filter-gerente-dropdown" role="listbox" aria-labelledby="filter-by-gerente-btn" aria-hidden="true">
                            <div class="filter-dropdown-inner" id="filter-gerente-options">
                                <button type="button" class="filter-option active" data-gerente-id="todos" role="option" aria-selected="true">
                                    Todos los gerentes
                                </button>
                                <div class="filter-empty-state">Cargando gerentes...</div>
                            </div>
                        </div>
                    </div>
                    {% endif %}
                </div>
                
                <table id="reclutas-table">
    <thead>
        <tr>
            <th width="60">Foto</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Puesto</th>
            <th width="120">Folio</th>
            <th width="100">Estado</th>
            <th id="asesor-header" class="asesor-column">Asesor</th>
            <th width="120">Acciones</th>
        </tr>
    </thead>
    <tbody id="reclutas-list">
        <tr>
            <td colspan="9" style="text-align: center;">Cargando reclutas...</td>
        </tr>
    </tbody>
</table>
                
                <div class="pagination">
                    <button class="pagination-btn" id="prev-page" disabled><i class="fas fa-chevron-left"></i></button>
                    <div id="pagination-numbers">
                        <span class="current-page">1</span> de <span id="total-pages">1</span>
                    </div>
                    <button class="pagination-btn" id="next-page" disabled><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>
