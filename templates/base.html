<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestión de Reclutas{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tutorial.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fixes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timeline.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timeline-modal.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/freted.png') }}" type="image/png">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="login-container">
                <i class="fas fa-users-cog"></i>
                <h1>SISTEMA DE GESTIÓN DE RECLUTAS</h1>
            </div>
            <div class="header-buttons">
                <button id="dark-mode-toggle" class="header-button">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="help-button" class="header-button">
                    <i class="fas fa-question-circle"></i> Ayuda
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Notificaciones -->
        <div id="notification" class="notification">
            <span id="notification-message"></span>
            <button id="notification-close"><i class="fas fa-times"></i></button>
        </div>

        {% block content %}
        <div id="metricas-admin-container" class="admin-only" style="display: none;">
            <h2>📊 Métricas Avanzadas por Asesor</h2>
            <button id="refresh-metricas-btn" class="btn btn-primary mb-3">
                <i class="fas fa-sync-alt"></i> Actualizar Métricas
            </button>
            <div id="resumen-global">
                <!-- Resumen global de métricas se renderizará aquí -->
            </div>
            <h3>Desempeño Individual de Asesores</h3>
            <div id="asesores-metricas" class="asesores-grid">
                <!-- Tarjetas de asesores se renderizarán aquí -->
            </div>
            <div id="metricas-loader" class="loader">Cargando métricas...</div>
        </div>
        {% endblock %}
    </div>

    {% block modals %}{% endblock %}

    {% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/configuracion.js') }}"></script>

    <!-- 📊 MÉTRICAS ADMIN - LEGACY -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/metricas-admin.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/admin.js') }}"></script>

    <!-- 🎯 MÉTRICAS ADMIN V2.0 - NUEVO SISTEMA -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/metricas-admin-v2.css') }}">
    <script src="{{ url_for('static', filename='js/metricas-admin-v2.js') }}"></script>

    <!-- 🔒 PANEL ADMINISTRATIVO DE RECLUTAS - SOLO ADMIN -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-reclutas-management.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/admin-reclutas-management.js') }}"></script>
    {% endblock %}
</body>
</html>
