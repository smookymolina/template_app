<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestion de Reclutas{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tutorial.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fixes.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timeline.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timeline-modal.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/new-timeline.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loader.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}?v={{ v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fichas-calculator.css') }}?v={{ v }}">
    <link rel="icon" href="{{ url_for('static', filename='img/freted.png') }}" type="image/png">
    {% block extra_css %}{% endblock %}

    <!-- Script para prevenir Flash of Unstyled Content (FOUC) -->
    <script>
        (function() {
            try {
                // Detectar preferencia guardada (general o por usuario si es posible)
                const themeKey = 'app_theme'; 
                // Nota: No podemos saber el usuario aquí fácilmente sin pasar variables de Flask, 
                // pero podemos buscar en todas las claves posibles o usar la general.
                let isDark = localStorage.getItem(themeKey) === 'true';
                
                // Si no hay preferencia, usar la del sistema
                if (localStorage.getItem(themeKey) === null) {
                    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                
                if (isDark) {
                    document.documentElement.classList.add('dark-mode');
                    document.body && document.body.classList.add('dark-mode');
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {
                console.error('Error in early theme application:', e);
            }
        })();
    </script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Header -->
    <header>
        <div class="header-container"></div>
    </header>

    <div class="container">
        <!-- Notificaciones -->
        <div id="notification" class="notification">
            <span id="notification-message"></span>
            <button id="notification-close"><i class="fas fa-times"></i></button>
        </div>

        {% block content %}
        {% endblock %}
    </div>

    {% block modals %}{% endblock %}

    {% block scripts %}
    <!-- Placeholder global para fotos de perfil -->
    <script>
        window.DEFAULT_PROFILE_PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23e2e8f0'/%3E%3Ccircle cx='50' cy='40' r='18' fill='%23a0aec0'/%3E%3Cellipse cx='50' cy='80' rx='28' ry='20' fill='%23a0aec0'/%3E%3C/svg%3E";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/config.js') }}?v={{ v }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/notifications.js') }}?v={{ v }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/ui.js') }}?v={{ v }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/auth.js') }}?v={{ v }}"></script>

    <!-- TRACKER DE ACTIVIDAD -->
    <script src="{{ url_for('static', filename='js/activity-tracker.js') }}?v={{ v }}"></script>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}?v={{ v }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/configuracion.js') }}?v={{ v }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/reclutas.js') }}?v={{ v }}"></script>

    <!-- GESTION DE USUARIOS (admin.js) -->
    <script type="module" src="{{ url_for('static', filename='js/admin.js') }}?v={{ v }}"></script>

    <!-- METRICAS ADMIN V2.0 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/metricas-admin-v2.css') }}?v={{ v }}">
    <script src="{{ url_for('static', filename='js/metricas-admin-v2.js') }}?v={{ v }}"></script>

    <!-- PANEL ADMINISTRATIVO DE RECLUTAS - SOLO ADMIN -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-reclutas-management.css') }}?v={{ v }}">
    <script type="module" src="{{ url_for('static', filename='js/admin-reclutas-management.js') }}?v={{ v }}"></script>

    <!-- PANEL ADMINISTRATIVO DE RECLUTAS - SOLO GERENTE -->
    <script type="module" src="{{ url_for('static', filename='js/gerente-panel.js') }}?v={{ v }}"></script>
    {% endblock %}
</body>
</html>
